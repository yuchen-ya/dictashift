[project]
name = "dictashift"
version = "0.1.0"
description = "DictaShift - Windows 常驻桌面语音输入工具"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyside6>=6.7",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "sentencepiece>=0.2",
    "httpx>=0.27",
    "pynput>=1.7",
    "onnxruntime>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictashift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: 依赖真实模型/GPU/麦克风的测试，默认跳过",
]
addopts = "-m 'not hardware'"
