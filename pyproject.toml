[project]
name = "dictashift"
version = "0.8.0"
description = "DictaShift - Windows 常驻语音输入与翻译工具（F8 中文听写、F9 中译英、F7 划词翻译、Alt+Q 快速查词）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "yuchen-ya" },
]
dependencies = [
    "pyside6>=6.7,<7.0",
    "qtawesome>=1.4,<2.0",
    "pywinstyles>=1.8,<2.0",
    "sounddevice>=0.5,<1.0",
    "numpy>=1.26,<3.0",
    "sentencepiece>=0.2,<1.0",
    "httpx>=0.27,<1.0",
    "pynput>=1.7,<2.0",
    "onnxruntime>=1.18,<2.0",
]

[project.urls]
Homepage = "https://github.com/yuchen-ya/dictashift"

[project.scripts]
dictashift = "dictashift.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pyinstaller>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictashift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: 依赖真实模型/麦克风的测试，默认跳过",
]
addopts = "-m 'not hardware'"
