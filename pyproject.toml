[project]
name = "dictashift"
version = "0.2.0"
description = "DictaShift - Windows 常驻桌面语音输入工具（按住 F8 中文听写、按住 F9 中文转英文输入）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "yuchen-ya" },
]
dependencies = [
    "pyside6>=6.7",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "sentencepiece>=0.2",
    "httpx>=0.27",
    "pynput>=1.7",
    "onnxruntime>=1.18",
]

[project.urls]
Homepage = "https://github.com/yuchen-ya/dictashift"

[project.scripts]
dictashift = "dictashift.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictashift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: 依赖真实模型/麦克风的测试，默认跳过",
]
addopts = "-m 'not hardware'"
